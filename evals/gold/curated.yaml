# Hand-authored gold questions for MenuMind retrieval eval.
# Every fact here was verified against the parsed menus in parse_output/.
#
# Fields:
#   id              unique slug
#   restaurant      exact payload value (scopes retrieval, as the app does)
#   question        what a user would actually ask
#   expected_facts  strings that MUST appear (normalized) in an answer-bearing
#                   chunk -> drives Hit@k / MRR / context-recall
#   expected_answer short ground-truth answer -> drives the correctness judge
#   category        price | description | hours | dietary | contact | availability | absent
#
# category: absent  -> the answer is NOT in the menu; retrieval metrics are
#                      skipped and the judge checks the model correctly declines.

# ---------------- Mocha Cafe ----------------
- id: mocha-cappuccino-large
  restaurant: Mocha Cafe
  question: How much is a large cappuccino at Cafe Mocha?
  expected_facts: [Cappuccino]
  expected_answer: "$4.60 for a large (large/L)."
  category: price

- id: mocha-blat-desc
  restaurant: Mocha Cafe
  question: What's in the BLAT?
  expected_facts: [BLAT]
  expected_answer: "Bacon, lettuce, avocado, tomato and aioli on Turkish bread."
  category: description

- id: mocha-vegan
  restaurant: Mocha Cafe
  question: Do you have any vegan dishes?
  expected_facts: [Vegan]
  expected_answer: "Yes - there's a vegan breakfast and vegan lunch section (acai bowl, nourish bowl, wraps, etc.)."
  category: dietary

- id: mocha-breakfast-hours
  restaurant: Mocha Cafe
  question: What time is breakfast served?
  expected_facts: ["breakfast 7"]
  expected_answer: "Breakfast is 7 - 11:30."
  category: hours

- id: mocha-truffle-fries
  restaurant: Mocha Cafe
  question: How much are the truffle parmesan fries?
  expected_facts: [Truffle parmesan fries]
  expected_answer: "$12."
  category: price

- id: mocha-sushi-absent
  restaurant: Mocha Cafe
  question: Do you serve sushi?
  expected_facts: []
  expected_answer: "No - sushi is not on the menu; the model should say so rather than invent it."
  category: absent

